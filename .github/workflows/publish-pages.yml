name: Publish field guides (manual)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "I approve publishing this catalog and both lab guides to this repository's GitHub Pages site"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.publish && github.repository == 'ppiova/foundry-field-notes-labs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Check recorded evidence and presentation behavior
        shell: pwsh
        run: |
          ./scripts/Build-BidPresentation.ps1 -Check
          node --test ./scripts/tests/site.test.cjs ./samples/01-support-signal/tests/presentation.test.cjs ./samples/02-bid-review-queue/tests/presentation.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Presentation checks failed.' }
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/site
      - name: Publish approved static portal
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
